name: Build .NET project       # klucz i wartość

on:                            # obiekt zagnieżdżony
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:                     # lista
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      
      - name: Show directory
        run: pwd

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
